[project]
name = "nail-studio-ai"
version = "0.1.0"
description = "Internal FastAPI service for Nail Studio chat, retrieval, and design recipes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "sentence-transformers>=3.0,<4",
  "pythainlp>=5.0,<6",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
